<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Митоз анимациясы</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #f1ecf8 0%, #e8e4f0 60%, #ddd8e8 100%); font-family: "Segoe UI", Arial, sans-serif; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .phase { position: absolute; left: 14px; top: 10px; font-size: 12px; color: #6a5f80; }
  .phase b { display: block; font-size: 18px; color: #3d2f63; font-family: Georgia, serif; font-weight: 400; }
  .note { position: absolute; right: 12px; bottom: 10px; font-size: 11px; color: #6a5f80; background: #ffffffc0; border-radius: 6px; padding: 4px 8px; }
</style>
</head>
<body>
<canvas id="view" role="img" aria-label="Өсімдік жасушасының митоз арқылы бөлінуінің моделі"></canvas>
<div class="phase">КЕЗЕҢ<b id="phase">Интерфаза</b></div>
<div class="note">Модельде 4 хромосома (2n = 4). Пиязда 2n = 16.</div>
<script src="bridge.js"></script>
<script>
(function () {
  "use strict";
  var A = JasushaAnim;
  var canvas = document.getElementById("view");
  var colors = ["#c2410c", "#c2410c", "#1d4ed8", "#1d4ed8"];
  var titles = { interphase: "Интерфаза", prophase: "Профаза", metaphase: "Метафаза", anaphase: "Анафаза", telophase: "Телофаза" };

  // Keyframes in cell units (-1..1). env: nuclear envelope, env2: two daughter nuclei,
  // cond: chromosome condensation, sep: sister chromatid separation, plate: cell plate.
  var frames = {
    interphase: { env: 1, env2: 0, cond: 0, spindle: 0, plate: 0, sep: 0, cx: [-.15, .12, -.06, .16], cy: [-.15, -.06, .16, .1], ang: [.4, -.3, 1, -.8], scaleY: 1 },
    prophase: { env: .35, env2: 0, cond: 1, spindle: .35, plate: 0, sep: 0, cx: [-.22, .2, -.14, .24], cy: [-.2, -.22, .17, .14], ang: [.6, -.4, 1.2, -1], scaleY: 1 },
    metaphase: { env: 0, env2: 0, cond: 1, spindle: 1, plate: 0, sep: 0, cx: [0, 0, 0, 0], cy: [-.42, -.14, .14, .42], ang: [0, 0, 0, 0], scaleY: 1 },
    anaphase: { env: 0, env2: 0, cond: 1, spindle: 1, plate: 0, sep: .46, cx: [0, 0, 0, 0], cy: [-.42, -.14, .14, .42], ang: [0, 0, 0, 0], scaleY: 1 },
    telophase: { env: 0, env2: 1, cond: .35, spindle: .2, plate: 1, sep: .62, cx: [0, 0, 0, 0], cy: [-.18, -.06, .06, .18], ang: [0, 0, 0, 0], scaleY: 1 },
  };
  var labelsFor = {
    interphase: [["Ядро", "nucleus"], ["Хроматин (ДНҚ екі еселенеді)", "chromatin"], ["Жасуша қабырғасы", "wall"]],
    prophase: [["Хромосома (екі хроматид)", "chromosome"], ["Ыдырап жатқан ядро қабықшасы", "nucleus"], ["Бөліну ұршығы", "spindle"]],
    metaphase: [["Экватор жазықтығы", "equator"], ["Бөліну ұршығының жіпшелері", "spindle"], ["Хромосома", "chromosome"]],
    anaphase: [["Хроматидтер полюстерге тартылады", "chromatid"], ["Полюс", "pole"], ["Ұршық жіпшесі", "spindle"]],
    telophase: [["Жаңа ядро", "nucleus2"], ["Жасуша пластинкасы", "plate"], ["Жас жасуша", "daughter"]],
  };
  var state = clone(frames.interphase), current = "interphase", showLabels = true;

  function clone(f) { return JSON.parse(JSON.stringify(f)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function blend(from, to, t) {
    var out = {};
    for (var k in to) out[k] = Array.isArray(to[k]) ? to[k].map(function (v, i) { return lerp(from[k][i], v, t); }) : lerp(from[k], to[k], t);
    return out;
  }

  function draw(now) {
    var f = A.fit(canvas), ctx = f.ctx, w = f.w, h = f.h;
    ctx.clearRect(0, 0, w, h);
    var S = Math.min(w * 0.42, h * 0.62), ox = w / 2, oy = h / 2 + 8;
    var X = function (u) { return ox + u * S; }, Y = function (v) { return oy + v * S * 0.62; };
    var s = state, anchors = {};

    // Plant cell wall (rectangular) and cytoplasm.
    ctx.fillStyle = "#fbf7ff"; ctx.strokeStyle = "#7c6aa6"; ctx.lineWidth = 5;
    roundRect(ctx, X(-1), Y(-1), S * 2, S * 0.62 * 2, 22); ctx.fill(); ctx.stroke();
    anchors.wall = [X(.98), Y(-.7)];

    // Spindle fibres from the poles.
    if (s.spindle > 0.02) {
      ctx.strokeStyle = "rgba(120,140,160," + (0.55 * s.spindle) + ")"; ctx.lineWidth = 1.2;
      for (var i = -5; i <= 5; i++) {
        [-1, 1].forEach(function (side) {
          ctx.beginPath(); ctx.moveTo(X(side * .82), Y(0));
          ctx.quadraticCurveTo(X(side * .35), Y(i * .1), X(0), Y(i * .09)); ctx.stroke();
        });
      }
      [-1, 1].forEach(function (side) { ctx.beginPath(); ctx.arc(X(side * .82), Y(0), 5, 0, Math.PI * 2); ctx.fillStyle = "rgba(90,110,130," + s.spindle + ")"; ctx.fill(); });
      anchors.spindle = [X(.45), Y(-.3)]; anchors.pole = [X(-.82), Y(0)];
    }

    // Nuclear envelope of the mother cell.
    if (s.env > 0.02) {
      ctx.setLineDash(s.env < 0.9 ? [6, 6] : []);
      ctx.beginPath(); ctx.ellipse(X(0), Y(0), S * .42, S * .42 * 0.62 * 1.25, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(196,181,253," + (0.35 * s.env) + ")"; ctx.fill();
      ctx.strokeStyle = "rgba(91,70,150," + s.env + ")"; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
      anchors.nucleus = [X(-.38), Y(-.3)];
    }
    // Daughter nuclei.
    if (s.env2 > 0.02) {
      [-1, 1].forEach(function (side) {
        ctx.beginPath(); ctx.ellipse(X(side * .62), Y(0), S * .2, S * .2 * 1.1, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(196,181,253," + (0.35 * s.env2) + ")"; ctx.fill();
        ctx.strokeStyle = "rgba(91,70,150," + s.env2 + ")"; ctx.lineWidth = 2; ctx.stroke();
      });
      anchors.nucleus2 = [X(-.62), Y(-.3)]; anchors.daughter = [X(.75), Y(.7)];
    }
    // Cell plate grows from the centre outwards.
    if (s.plate > 0.02) {
      ctx.strokeStyle = "#7c6aa6"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(X(0), Y(-s.plate)); ctx.lineTo(X(0), Y(s.plate)); ctx.stroke();
      anchors.plate = [X(0), Y(.5)];
    }
    if (current === "metaphase" && s.spindle > .5) {
      ctx.setLineDash([3, 5]); ctx.strokeStyle = "rgba(61,47,99,.4)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(0), Y(-.85)); ctx.lineTo(X(0), Y(.85)); ctx.stroke(); ctx.setLineDash([]);
      anchors.equator = [X(0), Y(-.85)];
    }

    // Chromosomes: two sister chromatids per chromosome.
    var rod = S * 0.11;
    for (var c = 0; c < 4; c++) {
      var cx = s.cx[c], cy = s.cy[c], ang = s.ang[c], col = colors[c];
      // Thin chromatin threads, visible while uncondensed.
      if (s.cond < 0.98) {
        ctx.strokeStyle = hexA(col, (1 - s.cond) * 0.7); ctx.lineWidth = 1.4;
        ctx.beginPath();
        for (var t = 0; t <= 1; t += 0.04) {
          var px = X(cx + (t - .5) * .3 * Math.cos(ang) + Math.sin(t * 18 + c) * .02), py = Y(cy + (t - .5) * .3 * Math.sin(ang) + Math.cos(t * 15 + c) * .04);
          if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
        if (c === 1) anchors.chromatin = [X(cx + .1), Y(cy)];
      }
      if (s.cond > 0.02) {
        ctx.lineCap = "round"; ctx.lineWidth = Math.max(4, S * 0.035); ctx.strokeStyle = hexA(col, s.cond);
        var len = rod * (0.6 + 0.4 * s.cond);
        [-1, 1].forEach(function (side) {
          var sx = X(cx + side * (s.sep + 0.022)), sy = Y(cy);
          // During anaphase chromatids bend into a V as they are pulled by the centromere.
          var bend = s.sep > 0.05 ? -side * rod * 0.35 * Math.min(1, s.sep * 3) : 0;
          ctx.beginPath();
          var dx = Math.sin(ang) * len / 2, dy = Math.cos(ang) * len / 2;
          ctx.moveTo(sx + bend + dx, sy - dy);
          ctx.quadraticCurveTo(sx - bend, sy, sx + bend - dx, sy + dy);
          ctx.stroke();
        });
        if (s.sep < 0.05) { ctx.beginPath(); ctx.arc(X(cx), Y(cy), 3, 0, Math.PI * 2); ctx.fillStyle = "#3d2f63"; ctx.fill(); }
        if (c === 0) { anchors.chromosome = [X(cx), Y(cy) - len / 2]; anchors.chromatid = [X(cx + s.sep), Y(cy)]; }
      }
    }

    if (showLabels) {
      ctx.font = Math.max(11, S * 0.05) + "px Segoe UI, Arial";
      var spots = [[w * .62, h * .12], [w * .04, h * .82], [w * .62, h * .88]];
      (labelsFor[current] || []).forEach(function (l, i) {
        var pt = anchors[l[1]]; if (!pt) return;
        var end = spots[i], tw = ctx.measureText(l[0]).width;
        ctx.beginPath(); ctx.moveTo(pt[0], pt[1]); ctx.lineTo(end[0] + tw / 2, end[1]); ctx.strokeStyle = "#3d2f6380"; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = "#ffffffeb"; ctx.fillRect(end[0] - 6, end[1] - S * .05, tw + 12, S * .08);
        ctx.fillStyle = "#3d2f63"; ctx.fillText(l[0], end[0], end[1] + S * .01);
        ctx.beginPath(); ctx.arc(pt[0], pt[1], 3, 0, Math.PI * 2); ctx.fillStyle = "#3d2f63"; ctx.fill();
      });
    }
    requestAnimationFrame(draw);
  }

  function hexA(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + Math.max(0, Math.min(1, a)).toFixed(3) + ")";
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  requestAnimationFrame(draw);

  JasushaBridge({
    run: function (stage) {
      if (!frames[stage]) return Promise.resolve();
      var from = clone(state), to = frames[stage];
      current = stage;
      document.getElementById("phase").textContent = titles[stage];
      return A.tween(stage === "interphase" ? 3000 : 7000, function (t) { state = blend(from, to, A.ease(t)); });
    },
    restore: function (completed) {
      var last = ["telophase", "anaphase", "metaphase", "prophase", "interphase"].filter(function (s) { return completed.indexOf(s) >= 0; })[0] || "interphase";
      current = last; state = clone(frames[last]);
      document.getElementById("phase").textContent = titles[last];
    },
    options: function (o) { if ("labels" in o) showLabels = !!o.labels; },
    capture: function () { return canvas.toDataURL("image/png"); },
  });
})();
</script>
</body>
</html>
