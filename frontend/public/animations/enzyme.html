<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Амилаза анимациясы</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#f3f9fc, #e6f0f5); font-family: "Segoe UI", Arial, sans-serif; }
  svg { width: 100%; height: 100%; display: block; }
  text { font-family: "Segoe UI", Arial, sans-serif; }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Йод тамызылатын алты сынауық">
  <defs>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/><stop offset=".35" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="420" width="800" height="80" fill="#d6e3ea"/>
  <g id="racks"></g>
  <g id="dropper" transform="translate(400 30)">
    <rect x="-9" y="0" width="18" height="34" rx="8" fill="#3d4f5c"/>
    <path d="M-6 34h12l-3 58h-6z" fill="#e9f3f8" stroke="#8fb4c5" stroke-width="2"/>
    <rect x="-4" y="60" width="8" height="30" fill="#b5651d" opacity=".8"/>
    <circle id="drop" cx="0" cy="96" r="0" fill="#9b5a1c"/>
  </g>
</svg>
<script src="bridge.js"></script>
<script>
(function () {
  "use strict";
  var A = JasushaAnim, NS = "http://www.w3.org/2000/svg";
  var starch = "#eef1f4";
  var colors = { blue: "#17264e", purple: "#8942ad", gold: "#d8a21d" };
  // Amylase with starch, iodine added after incubation. Results match the worksheet answer key.
  var tubes = [
    { id: "ph1", x: 95, rack: 0, label: "1", sub: "лимон қышқылы", result: "blue" },
    { id: "ph2", x: 205, rack: 0, label: "2", sub: "ас содасы", result: "purple" },
    { id: "ph3", x: 315, rack: 0, label: "3", sub: "су", result: "gold" },
    { id: "tempA", x: 485, rack: 1, label: "А", sub: "мұзды су", result: "blue", bath: "#cfe9fb" },
    { id: "tempAe", x: 595, rack: 1, label: "Ә", sub: "55–60°C", result: "blue", bath: "#fbd6cc" },
    { id: "tempB", x: 705, rack: 1, label: "Б", sub: "36–38°C", result: "gold", bath: "#fde9c9" },
  ];
  var racks = document.getElementById("racks"), dropper = document.getElementById("dropper"), drop = document.getElementById("drop");
  var dropperX = 400;

  function el(name, attrs, parent) {
    var node = document.createElementNS(NS, name);
    for (var k in attrs) node.setAttribute(k, attrs[k]);
    (parent || racks).appendChild(node);
    return node;
  }

  [["pH тұғыры", 205], ["Температура тұғыры", 595]].forEach(function (r) {
    el("rect", { x: r[1] - 165, y: 370, width: 330, height: 22, rx: 6, fill: "#9db8c6" });
    el("text", { x: r[1], y: 468, "text-anchor": "middle", "font-size": 18, "font-weight": 700, fill: "#24506a" }).textContent = r[0];
  });

  tubes.forEach(function (t) {
    if (t.bath) el("rect", { x: t.x - 42, y: 250, width: 84, height: 120, rx: 10, fill: t.bath, opacity: .9 });
    var g = el("g", {});
    el("path", { d: "M" + (t.x - 20) + " 150 v170 a20 20 0 0 0 40 0 v-170", fill: "#f7fcff", stroke: "#a8c4d2", "stroke-width": 3 }, g);
    t.liquid = el("path", { d: "M" + (t.x - 17) + " 230 v90 a17 17 0 0 0 34 0 v-90 z", fill: starch }, g);
    t.ripple = el("ellipse", { cx: t.x, cy: 230, rx: 0, ry: 0, fill: "none", stroke: "#ffffff", "stroke-width": 2, opacity: 0 }, g);
    el("path", { d: "M" + (t.x - 20) + " 150 v170 a20 20 0 0 0 40 0 v-170", fill: "url(#glass)", opacity: .6 }, g);
    el("rect", { x: t.x - 24, y: 144, width: 48, height: 8, rx: 3, fill: "#8fb4c5" }, g);
    el("text", { x: t.x, y: 404, "text-anchor": "middle", "font-size": 17, "font-weight": 700, fill: "#173249" }).textContent = t.label;
    el("text", { x: t.x, y: 424, "text-anchor": "middle", "font-size": 12, fill: "#4f6b7c" }).textContent = t.sub;
    t.tag = el("text", { x: t.x, y: 132, "text-anchor": "middle", "font-size": 13, "font-weight": 700, fill: "#173249", opacity: 0 });
  });

  function mix(a, b, t) {
    var pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    var r = Math.round(((pa >> 16) & 255) + ((((pb >> 16) & 255) - ((pa >> 16) & 255)) * t));
    var g = Math.round(((pa >> 8) & 255) + ((((pb >> 8) & 255) - ((pa >> 8) & 255)) * t));
    var bl = Math.round((pa & 255) + (((pb & 255) - (pa & 255)) * t));
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
  }

  var names = { blue: "көк-қара", purple: "күлгін", gold: "сары-қоңыр" };
  function reveal(t, on) {
    t.liquid.setAttribute("fill", on ? colors[t.result] : starch);
    t.tag.textContent = on ? names[t.result] : "";
    t.tag.setAttribute("opacity", on ? 1 : 0);
  }

  function moveDropper(to, ms) {
    var from = dropperX;
    return A.tween(ms, function (p) {
      dropperX = from + (to - from) * A.ease(p);
      dropper.setAttribute("transform", "translate(" + dropperX + " 30)");
    });
  }

  JasushaBridge({
    run: function (stage) {
      var t = tubes.filter(function (x) { return x.id === stage; })[0];
      if (!t) return Promise.resolve();
      reveal(t, false);
      return moveDropper(t.x, 1400)
        .then(function () {
          return A.tween(900, function (p) {
            drop.setAttribute("r", p < .3 ? p * 18 : 5.5);
            drop.setAttribute("cy", 96 + (p < .3 ? 0 : (p - .3) / .7 * 104));
          });
        })
        .then(function () {
          drop.setAttribute("r", 0); drop.setAttribute("cy", 96);
          var target = colors[t.result];
          // Iodine first spreads as a brown cloud, then the colour of the reaction appears.
          return A.tween(4200, function (p) {
            var c = p < .25 ? mix(starch, "#b07a3c", p / .25) : mix("#b07a3c", target, A.ease((p - .25) / .75));
            t.liquid.setAttribute("fill", c);
            t.ripple.setAttribute("rx", 4 + p * 14); t.ripple.setAttribute("ry", 1 + p * 4); t.ripple.setAttribute("opacity", 1 - p);
          });
        })
        .then(function () {
          reveal(t, true);
          return moveDropper(400, 900);
        })
        .then(function () { return { color: t.result }; });
    },
    restore: function (completed) {
      tubes.forEach(function (t) { reveal(t, completed.indexOf(t.id) >= 0); });
    },
  });
})();
</script>
</body>
</html>
