 if(state.captures.length===2)return "Енді жасушаны таза сумен шай. Тірі жасушаға су қайта еніп, протопласт ұлғая алады. Бұл — деплазмолиз. Осы модельде қалпына келу көрсетілген.";
 return "Үш бақылау да дайын! Енді зерттеу журналына өт. Сұрақтарға жауап беріп, тәжірибеден қандай қорытынды жасағаныңды өз сөзіңмен жаз.";

function loadVoices(){try{voices=speechSynthesis.getVoices();updateAudio()}catch{}}
function kkVoice(){return voices.find(v=>/^kk(?:[-_]|$)/i.test(v.lang))}
function updateAudio(){const n=$("#voice-note");if(n)n.textContent=kkVoice()?"Қазақша дауыс дайын · тыңдау үшін бас":"Қазақша дауыс орнатылмаса, мәтіндік нұсқа қолжетімді.";const b=$("#audio-button");if(b)b.innerHTML=icons.sound+" "+(speaking?"Тоқтату":"Нұсқауды тыңдау");const bars=$("#voice-bars");if(bars)bars.classList.toggle("talking",speaking)}
function stopAudio(){if("speechSynthesis"in window)speechSynthesis.cancel();speaking=false;updateAudio()}
function speak(){
 if(speaking){stopAudio();return}
 if(!("speechSynthesis"in window))return toast("Бұл браузерде дыбыстау қолжетімсіз. Нұсқауды мәтіннен оқы.");
 loadVoices();const voice=kkVoice();if(!voice)return toast("Қазақша жүйелік дауыс табылмады. Нұсқаудың толық мәтіні экранда көрсетілген.");
 const u=new SpeechSynthesisUtterance(guide());u.lang="kk-KZ";u.voice=voice;u.rate=.9;
 u.onend=u.onerror=()=>{speaking=false;updateAudio()};speaking=true;updateAudio();speechSynthesis.speak(u);
}

function startTrial(kind){
 if(!state.name)return studentModal();
 if(state.submitted)return toast("Бұл жұмыс аяқталған. Жаңа оқушы сеансын бастауға болады.");
 if(isExpired())return toast("Тапсыру мерзімі аяқталды.");
 if(sim)return;
 const n=state.captures.length;
 if((kind==="water"&&n!==0)||(kind==="salt"&&n!==1)||(kind==="rinse"&&n!==2))return;
 stopAudio();activeKind=kind;readyCapture=false;fromShrink=shrink;targetShrink=kind==="salt"?.27+Number(state.concentration)*.045:0;
 progress=0;sim={start:performance.now(),duration:reduced?900:6200};render();
}

 const bar=$("#sim-progress");if(bar)bar.style.width=(progress*100)+"%";

}

function buildReport(){return {schema:"jasusha-report-v1",id:state.submissionId||("r-"+Date.now()+"-"+Math.random().toString(36).slice(2,7)),assignmentId:config.id,assignmentTitle:config.title,name:state.name,className:state.className,hypothesis:state.hypothesis,captures:state.captures,answers:state.answers,conclusion:state.conclusion,submittedAt:new Date().toISOString(),deadline:config.deadline,late:isExpired(),demo:false}}

function csv(){
 const rows=[["Оқушы","Сынып","Тапсырма","Уақыт","Теория / 3","Бақылау саны","Күйі","Қорытынды"],...reportsForClass().map(r=>[r.name,r.className,r.assignmentTitle,r.submittedAt,score(r.answers),r.captures.length,r.demo?"ҮЛГІ":r.late?"Кешікті":"Аяқталды",r.conclusion])];

function validateReport(r){
 if(!r||r.schema!=="jasusha-report-v1"||r.assignmentId!==config.id)throw Error("Бұл есеп басқа тапсырмаға тиесілі немесе форматы жарамсыз.");
 if(typeof r.name!=="string"||!r.name.trim()||typeof r.id!=="string"||!Number.isFinite(Date.parse(r.submittedAt)))throw Error("Есепте міндетті деректер жетіспейді.");
 if(!Array.isArray(r.captures)||r.captures.length!==3||r.captures.some((c,i)=>c?.kind!==["water","salt","rinse"][i]))throw Error("Үш бақылау дұрыс ретпен болуы керек.");
 if(qs.some(q=>!q.options.some(o=>o[0]===r.answers?.[q.id])))throw Error("Теориялық жауаптар толық емес.");
 return {schema:r.schema,id:r.id.slice(0,100),assignmentId:config.id,assignmentTitle:config.title,name:r.name.slice(0,80),className:String(r.className||"").slice(0,30),hypothesis:String(r.hypothesis||"").slice(0,300),captures:r.captures.map(c=>({kind:c.kind,note:String(c.note||"").slice(0,1000),concentration:Math.max(0,Math.min(8,Number(c.concentration)||0)),image:typeof c.image==="string"&&/^data:image\/png;base64,[a-zA-Z0-9+/=]+$/.test(c.image)&&c.image.length<2000000?c.image:""})),answers:Object.fromEntries(qs.map(q=>[q.id,r.answers[q.id]])),conclusion:String(r.conclusion||"").slice(0,3000),submittedAt:new Date(r.submittedAt).toISOString(),late:!!config.deadline&&Date.parse(r.submittedAt)>Date.parse(config.deadline),demo:!!r.demo};
}
async function importReports(file){
 if(!file)return;if(file.size>12000000)return toast("Файл тым үлкен. 12 МБ-тан кіші JSON таңдаңыз.");
 try{const data=JSON.parse(await file.text()),raw=Array.isArray(data)?data:[data];if(raw.length>100)throw Error("Бір импортта 100 есептен артық болмауы керек.");const parsed=raw.map(validateReport);let count=0;for(const r of parsed){if(!allReports.some(x=>x.id===r.id)){allReports.push(r);count++}}
 const ok=write("jasusha.reports",allReports);render();toast(ok?`${count} жаңа есеп импортталды.`:"Есеп ашылды, бірақ браузер жадына сақтау мүмкін болмады. CSV жүктеп алыңыз.");
 }catch(e){toast(e.message||"Файлды оқу мүмкін болмады.")}
}

document.addEventListener("submit",async e=>{
 const f=e.target;

 }
 if(f.id==="capture-form"){

 state.captures.push({kind:f.dataset.kind,note,image:f._snapshot,concentration:f.dataset.kind==="salt"?Number(state.concentration):0,at:new Date().toISOString()});
 readyCapture=false;save();closeModal();render();toast(state.captures.length===3?"Үш бақылау сақталды. Енді қорытынды жаз.":"Бақылау журналға сақталды.");
 }
 if(f.id==="report-form"){
 if(isExpired())return toast("Тапсыру мерзімі аяқталды.");if(state.submitted)return;if(state.captures.length!==3)return toast("Алдымен үш бақылауды аяқта.");
 state.answers=Object.fromEntries(qs.map(q=>[q.id,String(d.get(q.id)||"")]));
 state.conclusion=String(d.get("conclusion")).trim();if(state.conclusion.length<20||qs.some(q=>!state.answers[q.id]))return toast("Барлық сұраққа жауап беріп, қорытындыны толықтыр.");
 const r=buildReport();
 if(serverMode){try{const response=await fetch("/api/labs/"+encodeURIComponent(config.id)+"/submissions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...r,clientId:r.id})});const result=await response.json();if(!response.ok)throw Error(result.error||"Есеп жіберілмеді.");r.id=result.id}catch(error){toast(error.message||"Серверге қосылу мүмкін болмады. Кейін қайта көріңіз.");return}}
 state.submissionId=r.id;state.submitted=true;allReports.push(r);const ok=write("jasusha.reports",allReports);save();stopAudio();render();toast(serverMode?"Есеп мұғалім кабинетіне жіберілді.":ok?"Жұмыс осы браузерге сақталды. Есепті жүктеп алыңыз.":"Браузерде сақтау мүмкін болмады. Есепті қазір жүктеп алыңыз.");
 }
 if(f.id==="settings-form"){
 const title=String(d.get("title")).trim(),className=String(d.get("className")).trim();if(!title||!className)return toast("Тапсырма атауы мен сыныпты толтырыңыз.");

document.addEventListener("input",e=>{
 if(e.target.id==="concentration"){state.concentration=Number(e.target.value);$("#concentration-label").textContent=state.concentration+"%";$("#salt-label").textContent=state.concentration+"% · тәжірибе";save()}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if(e.key==="Tab"&&$("#modal-root .modal")){const items=[...$("#modal-root .modal").querySelectorAll("button,input,textarea,select,a[href]")].filter(x=>!x.disabled&&!x.hidden),first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function polygonPath(ctx,points,round=.18){
 const n=points.length;ctx.beginPath();
 for(let i=0;i<n;i++){const a=points[(i+n-1)%n],b=points[i],c=points[(i+1)%n],p=[b[0]+(a[0]-b[0])*round,b[1]+(a[1]-b[1])*round],q=[b[0]+(c[0]-b[0])*round,b[1]+(c[1]-b[1])*round];if(i===0)ctx.moveTo(...p);else ctx.lineTo(...p);ctx.quadraticCurveTo(b[0],b[1],q[0],q[1])}ctx.closePath();
}
let lastFrame=0;
function paint(now){
 requestAnimationFrame(paint);
 if(now-lastFrame<32)return;lastFrame=now;
 if(sim){
 progress=Math.min(1,(now-sim.start)/sim.duration);
 const ease=progress*progress*(3-2*progress);shrink=fromShrink+(targetShrink-fromShrink)*ease;
 updateLive();
 if(progress>=1){sim=null;readyCapture=true;shrink=targetShrink;render();}
 }
 const canvas=$("#microscope");if(!canvas)return;
 const rect=canvas.getBoundingClientRect();if(rect.width<=0)return;
 const dpr=Math.min(devicePixelRatio||1,2),w=rect.width,h=rect.height;
 if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}
 const ctx=canvas.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 const bg=ctx.createRadialGradient(w*.38,h*.32,3,w*.5,h*.5,w*.66);bg.addColorStop(0,"#f6e7e6");bg.addColorStop(.6,"#e1b7cf");bg.addColorStop(1,"#b88bb3");ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 ctx.save();ctx.translate(w/2,h/2);ctx.rotate(-.27);
 const scale=state.zoom===100?.6:state.zoom===600?1.33:1;
 const cw=w*.38*scale,ch=h*.225*scale;
 let selected=null;
 for(let row=-6;row<=6;row++){
 for(let col=-5;col<=5;col++){
 const id=(row+10)*33+col+10,j=(hash(id)-.5)*.07,cx=col*cw+((row%2)?cw*.48:0),cy=row*ch;
 if(Math.abs(cx)>w*.9+cw||Math.abs(cy)>h*.9+ch)continue;
 const raw=[[-.49,-.37],[-.34,-.49],[.37,-.47],[.5,-.28],[.49,.34],[.32,.48],[-.38,.47],[-.51,.27]];
 const points=raw.map((p,i)=>[cx+(p[0]+(hash(id+i+100)-.5)*.06)*cw,cy+(p[1]+(hash(id+i+200)-.5)*.05)*ch]);
 polygonPath(ctx,points,.15);
 ctx.fillStyle="rgba(255,240,228,.58)";ctx.fill();ctx.strokeStyle="#9d647d";ctx.lineWidth=2.5;ctx.stroke();
 ctx.strokeStyle="rgba(255,253,227,.9)";ctx.lineWidth=.75;ctx.stroke();
 const factor=1-shrink*(.8+hash(id)*.2);
 const inside=points.map(p=>[cx+(p[0]-cx)*factor*.94,cy+(p[1]-cy)*factor*.9]);
 polygonPath(ctx,inside,shrink>.15?.49:.2);
 const gel=ctx.createLinearGradient(cx-cw*.4,cy-ch*.4,cx+cw*.4,cy+ch*.5);
 gel.addColorStop(0,`rgba(205,92,151,${.22+shrink*.5})`);gel.addColorStop(.6,`rgba(161,57,126,${.3+shrink*.55})`);gel.addColorStop(1,`rgba(105,47,112,${.3+shrink*.45})`);
 ctx.fillStyle=gel;ctx.shadowColor="#84236744";ctx.shadowBlur=shrink>0?4:2;ctx.fill();ctx.shadowBlur=0;
 ctx.strokeStyle=`rgba(112,46,104,${.5+shrink*.35})`;ctx.lineWidth=1.5;ctx.stroke();
 const vac=inside.map(p=>[cx+(p[0]-cx)*.77,cy+(p[1]-cy)*.73]);
 polygonPath(ctx,vac,.5);ctx.fillStyle="rgba(192,91,153,.2)";ctx.fill();ctx.strokeStyle="rgba(248,180,215,.6)";ctx.lineWidth=1;ctx.stroke();
 for(let g=0;g<13;g++){
 const dx=(hash(id*31+g)-.5)*cw*.77*factor,dy=(hash(id*7+g+900)-.5)*ch*.67*factor;
 ctx.beginPath();ctx.arc(cx+dx,cy+dy,.5+hash(g+id)*1.4,0,Math.PI*2);ctx.fillStyle="rgba(100,48,108,.18)";ctx.fill();
 }
 const nx=cx+cw*.31*factor,ny=cy-ch*.11*factor;
 ctx.beginPath();ctx.ellipse(nx,ny,cw*.034+1,ch*.09+1,-.2,0,Math.PI*2);
 const ng=ctx.createRadialGradient(nx-1,ny-1,.5,nx,ny,ch*.12);ng.addColorStop(0,"#96558ba8");ng.addColorStop(.6,"#66336eae");ng.addColorStop(1,"#944b8e20");ctx.fillStyle=ng;ctx.fill();
 ctx.beginPath();ctx.arc(nx,ny,1.1,0,Math.PI*2);ctx.fillStyle="#51265a70";ctx.fill();
 if(shrink>.16){
 ctx.strokeStyle="#b565a14a";ctx.lineWidth=.7;
 for(let a=0;a<8;a+=2){ctx.beginPath();ctx.moveTo(...points[a]);ctx.lineTo(...inside[a]);ctx.stroke()}
 }
 if(state.particles&&sim&&!reduced){
 for(let p=0;p<4;p++){
 const phase=((now/1900)+hash(id+p*7))%1,ang=hash(id+p*19)*Math.PI*2;
 const rad=activeKind==="salt"?.13+phase*.5:.63-phase*.49;
 const px=cx+Math.cos(ang)*cw*rad,py=cy+Math.sin(ang)*ch*rad;
 ctx.beginPath();ctx.arc(px,py,1.8,0,Math.PI*2);ctx.fillStyle=`rgba(111,214,231,${Math.sin(phase*Math.PI)*.85})`;ctx.shadowColor="#c5f9ff";ctx.shadowBlur=4;ctx.fill();ctx.shadowBlur=0;
 }
 }
 if(row===0&&col===0)selected={wall:points[2],nucleus:[nx,ny],vacuole:[cx-cw*.08*factor,cy]};
 }}
 ctx.restore();
 for(let i=0;i<170;i++){const x=hash(i*2+11)*w,y=hash(i*2+12)*h;ctx.fillStyle=i%2?"#fff5":"#633d6210";ctx.fillRect(x,y,hash(i+8)*1.6+.2,hash(i+9)*1.2+.2)}
 if(state.labels&&selected){
 const convert=p=>[w/2+p[0]*Math.cos(-.27)-p[1]*Math.sin(-.27),h/2+p[0]*Math.sin(-.27)+p[1]*Math.cos(-.27)];
 const items=[["Жасуша қабырғасы",convert(selected.wall),[w*.57,h*.2]],["Вакуоль",convert(selected.vacuole),[w*.09,h*.66]],["Ядро",convert(selected.nucleus),[w*.67,h*.75]]];
 ctx.font=`${Math.max(8,w*.027)}px Arial`;
 for(const [txt,pt,end] of items){ctx.beginPath();ctx.moveTo(...pt);ctx.lineTo(end[0]+10,end[1]+9);ctx.strokeStyle="#fff9";ctx.lineWidth=.8;ctx.stroke();const tw=ctx.measureText(txt).width;ctx.fillStyle="#fff9";ctx.fillRect(end[0]-4,end[1]-3,tw+9,15);ctx.fillStyle="#673e60";ctx.fillText(txt,end[0],end[1]+8);ctx.beginPath();ctx.arc(pt[0],pt[1],2,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill()}
 }
 const shade=ctx.createRadialGradient(w*.48,h*.45,w*.22,w*.5,h*.5,w*.55);shade.addColorStop(0,"#33213a00");shade.addColorStop(.78,"#33213a06");shade.addColorStop(1,"#1d143b8c");ctx.fillStyle=shade;ctx.fillRect(0,0,w,h);
 ctx.beginPath();ctx.ellipse(w*.34,h*.16,w*.2,h*.055,-.5,0,Math.PI*2);ctx.fillStyle="#ffffff0c";ctx.fill();
}
async function initialize(){
 if(serverMode){
  const id=new URLSearchParams(location.search).get("lab")||base.id;
  try{const response=await fetch("/api/labs/"+encodeURIComponent(id),{cache:"no-store"});const data=await response.json();if(!response.ok||data.lab.kind!=="osmosis")throw Error(data.error||"Зертхана табылмады.");serverLab=data.lab;config=cleanConfig({id:data.lab.id,title:data.lab.title,className:data.lab.className,deadline:data.lab.deadline});state={...fresh(),...read("jasusha.session."+config.id,{})};if(!Array.isArray(state.captures))state.captures=[];state.captures=state.captures.filter(x=>x&&["water","salt","rinse"].includes(x.kind)).slice(0,3);state.answers=state.answers&&typeof state.answers==="object"?state.answers:{};shrink=state.captures.length===2?.52:0;fromShrink=shrink;targetShrink=shrink}
  catch(error){serverMode=false;toast("Сервер қосылмады: "+error.message)}
 }
 render();
}
initialize();
if(serverMode)setInterval(async()=>{if(!serverLab)return;try{const r=await fetch("/api/labs/"+encodeURIComponent(config.id),{cache:"no-store"});if(!r.ok)return;const data=await r.json();if(data.lab.accepting!==serverLab.accepting||data.lab.deadline!==serverLab.deadline||data.lab.title!==serverLab.title){serverLab=data.lab;config=cleanConfig({id:data.lab.id,title:data.lab.title,className:data.lab.className,deadline:data.lab.deadline});render()}}catch{}},30000);
if("speechSynthesis"in window){loadVoices();speechSynthesis.addEventListener("voiceschanged",loadVoices)}
requestAnimationFrame(paint);
})();
