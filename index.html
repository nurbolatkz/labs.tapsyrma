<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jasusha Lab · Зертханалар</title><style>
:root{--ink:#173b35;--muted:#70827b;--green:#26785c;--line:#e0e9e2;--bg:#f4f7f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Arial,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}.shell{max-width:1160px;margin:auto;padding:0 24px}.top{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;font-weight:800;letter-spacing:-1px}.brand span{color:var(--green);font-weight:400}.teacher{padding:10px 15px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-weight:700}.teacher:hover,.card:hover{border-color:#9ac7a6}.hero{padding:74px 0 56px;display:grid;grid-template-columns:1.4fr .6fr;align-items:center;gap:25px}.eyebrow{font-size:11px;color:var(--green);letter-spacing:2px;font-weight:800;text-transform:uppercase}.hero h1{font:400 clamp(39px,5vw,64px)/1.07 Georgia,serif;letter-spacing:-2px;margin:15px 0 18px;max-width:720px}.hero p{font-size:17px;color:var(--muted);max-width:580px;margin:0}.hero-art{height:235px;border-radius:30px;background:radial-gradient(circle at 35% 38%,#ffebe9,#e0efe4 58%,#d9e8dc);display:grid;place-items:center;font-size:105px;box-shadow:0 20px 55px #244a3417}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.sectionhead h2{font:400 30px Georgia,serif;margin:0}.sectionhead p{color:var(--muted);font-size:13px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:25px;display:flex;flex-direction:column;min-height:235px;transition:.2s;box-shadow:0 10px 30px #173b3509}.card:hover{transform:translateY(-3px);box-shadow:0 15px 40px #173b3512}.card .icon{font-size:28px;background:#ecf6ec;width:52px;height:52px;display:grid;place-items:center;border-radius:14px}.card.enzyme .icon{background:#fff2e6}.meta{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px;margin-top:18px}.badge{border-radius:50px;background:#e8f5e9;color:#207450;padding:3px 9px;font-weight:700}.badge.closed{background:#fff0e6;color:#a15b22}.card h3{font:400 24px Georgia,serif;margin:12px 0 8px}.card p{color:var(--muted);font-size:13px;margin:0}.card .arrow{margin-top:auto;padding-top:17px;color:var(--green);font-size:13px;font-weight:800}.empty{padding:25px;background:white;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}footer{border-top:1px solid var(--line);margin-top:55px;padding:24px 0;color:var(--muted);font-size:12px}@media(max-width:700px){.hero{grid-template-columns:1fr;padding:48px 0 35px}.hero-art{height:140px;font-size:70px}.grid{grid-template-columns:1fr}.shell{padding:0 16px}}
</style></head><body><header class="top"><div class="shell" style="display:flex;align-items:center;justify-content:space-between;width:100%"><a class="brand" href="/">jasusha<span>lab</span></a><a class="teacher" href="/teacher.html">Мұғалім кабинеті ↗</a></div></header><main class="shell"><section class="hero"><div><div class="eyebrow">Биология · Интерактивті тәжірибе</div><h1>Зертте. Бақыла. Қорытынды жаса.</h1><p>Зертхананы таңда, тәжірибені орында және нәтижеңді мұғалімге тікелей тапсыр.</p></div><div class="hero-art" aria-hidden="true">🔬</div></section><div class="sectionhead"><div><div class="eyebrow">Тапсырмалар</div><h2>Зертханалар тізімі</h2></div><p id="count">Жүктелуде…</p></div><div class="grid" id="labs"></div><footer>Jasusha Lab · Оқу тәжірибелері</footer></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/api/labs').then(async r=>{if(!r.ok)throw Error('Сервер жауап бермеді.');return r.json()}).then(({labs})=>{document.getElementById('count').textContent=labs.length+' зертхана';document.getElementById('labs').innerHTML=labs.map(l=>`<a class="card ${l.kind==='enzyme'?'enzyme':''}" href="/${l.kind==='enzyme'?'fermentter_zhumys_paragy.html':'preview.html'}?lab=${encodeURIComponent(l.id)}"><span class="icon">${l.kind==='enzyme'?'⚗️':'🔬'}</span><div class="meta"><span>${esc(l.className)} сынып</span><span class="badge ${l.accepting?'':'closed'}">${l.accepting?'Ашық':l.status==='expired'?'Мерзімі аяқталды':'Жабық'}</span></div><h3>${esc(l.title)}</h3><p>${l.deadline?'Соңғы мерзім: '+esc(new Date(l.deadline).toLocaleString('kk-KZ')):'Мерзім шектеуі жоқ'}</p><span class="arrow">${l.accepting?'Зертхананы ашу':'Жұмысты көру'} →</span></a>`).join('')||'<div class="empty">Әзірге зертхана жоқ.</div>'}).catch(e=>{document.getElementById('labs').innerHTML='<div class="empty">'+esc(e.message)+'</div>';document.getElementById('count').textContent='';});
</script></body></html>
