<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мұғалім кабинеті · Jasusha Lab</title><style>
:root{--ink:#18382f;--muted:#73857c;--green:#27785b;--line:#e0e9e2;--bg:#f4f7f2;--mint:#e9f5ec;--gold:#b77c34}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Arial,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #a6d8b4;outline-offset:2px}a{color:inherit;text-decoration:none}.top{background:#fff;border-bottom:1px solid var(--line)}.topinner{max-width:1320px;margin:auto;padding:0 26px;height:76px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;letter-spacing:-1px;font-weight:800}.brand span{color:var(--green);font-weight:400}.toplinks{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted)}.toplinks a:hover{color:var(--green)}.shell{max-width:1320px;margin:auto;padding:32px 26px 70px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:1.7px;text-transform:uppercase;font-weight:800}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.heading h1{font:400 clamp(31px,3.4vw,48px)/1.15 Georgia,serif;margin:7px 0}.heading p{color:var(--muted);margin:0}.btn{background:#fff;border:1px solid #d8e5db;border-radius:9px;padding:10px 14px;color:var(--ink);font-size:12px;font-weight:700;white-space:nowrap}.btn:hover{background:#f1f8f2}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.primary:hover{background:#1d6249}.btn:disabled{opacity:.55;cursor:not-allowed}.layout{display:grid;grid-template-columns:305px minmax(0,1fr);gap:18px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 25px #1d483008}.panelhead{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panelhead h2{font-size:14px;margin:0}.lablist{padding:10px}.labitem{width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:14px;border-radius:11px;display:block;margin:3px 0}.labitem:hover{background:#f4f8f3}.labitem.on{background:#eaf4ec;border-color:#cfe4d4}.labitem b{display:block;font-size:13px;line-height:1.35}.labitem small{display:block;color:var(--muted);margin-top:6px}.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;padding:4px 8px;border-radius:50px;background:#e8f5eb;color:#287650}.tag.closed{background:#fff0e5;color:#a86c2e}.labitem .tag{margin-top:8px}.content{display:grid;gap:18px}.intro{padding:22px}.intro h2{font:400 27px Georgia,serif;margin:5px 0 7px}.intro p{color:var(--muted);margin:0}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.stat span{display:block;color:var(--muted);font-size:11px}.stat b{display:block;font:400 29px Georgia,serif;margin-top:7px}.formgrid{display:grid;grid-template-columns:2fr 1fr;gap:12px;padding:19px}.field{display:block;font-size:12px;font-weight:700;color:#4e6b5a}.field input,.field select{width:100%;padding:10px 11px;border:1px solid #ccded0;border-radius:9px;background:#fff;margin-top:5px;color:var(--ink)}.wide{grid-column:1/-1}.settingsfoot{padding:0 19px 19px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.switchline{display:flex;align-items:center;gap:9px;font-size:12px}.switchline input{accent-color:var(--green);width:17px;height:17px}.hint{color:var(--muted);font-size:11px}.sharebar{padding:17px 19px;background:#f9fbf8;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.sharebar code{font:11px Consolas,monospace;color:#4c6f59;overflow-wrap:anywhere}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th{color:var(--muted);font-size:10px;letter-spacing:.7px;text-transform:uppercase;text-align:left;background:#fafcf9}td,th{padding:13px 17px;border-bottom:1px solid #edf2eb}td{font-size:12px}tr:last-child td{border-bottom:0}.empty{padding:40px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}.notice{background:#eaf5ec;border:1px solid #d0e7d5;color:#2b6e44;padding:12px 15px;border-radius:10px;font-size:12px;margin-bottom:18px}.notice.error{background:#fff1ec;color:#9d4e31;border-color:#f2d4c7}.login{max-width:420px;margin:70px auto;padding:28px}.login h1{font:400 32px Georgia,serif;margin:8px 0}.login p{color:var(--muted)}.login .field{margin:20px 0}.login .btn{width:100%}.detail{padding:22px}.detail h2{font:400 25px Georgia,serif;margin:7px 0}.detail h3{font-size:13px;margin:20px 0 6px}.detail p{white-space:pre-wrap;color:#496557}.detail .answer{background:#f6faf6;border:1px solid var(--line);border-radius:9px;padding:12px;margin:10px 0}.modalback{position:fixed;inset:0;background:#12271dbb;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:17px;box-shadow:0 20px 60px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:14px 20px}.modalbody{padding:0 2px}.status{color:var(--muted);font-size:11px}@media(max-width:850px){.layout{grid-template-columns:1fr}.lablist{display:flex;overflow-x:auto}.labitem{min-width:190px}.statgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:550px){.shell,.topinner{padding-left:14px;padding-right:14px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.statgrid{grid-template-columns:1fr 1fr}.heading{align-items:start;flex-direction:column}.toplinks{gap:8px}}
</style></head><body><header class="top"><div class="topinner"><a href="/" class="brand">jasusha<span>lab</span></a><nav class="toplinks"><a href="/">Зертханалар</a><span>Мұғалім кабинеті</span><button class="btn" id="logout" hidden>Шығу</button></nav></div></header><main class="shell" id="app"></main><div id="modal-root"></div><script>
(()=>{'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let labs=[],selected='',results=[],message='',error=false;
const dateText=s=>s?new Date(s).toLocaleString('kk-KZ',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Мерзім жоқ';
const localDate=s=>{if(!s)return '';const d=new Date(s);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};
const label=l=>l.status==='expired'?'Мерзімі аяқталды':l.accepting?'Ашық':'Жабық';
const link=l=>new URL('/'+(l.kind==='enzyme'?'fermentter_zhumys_paragy.html':'preview.html')+'?lab='+encodeURIComponent(l.id),location.href).href;
async function api(path,method='GET',body){const r=await fetch(path,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'Сұрау орындалмады.');return data}
function notice(){return message?`<div class="notice ${error?'error':''}" role="status">${esc(message)}</div>`:''}
function setMessage(text,isError=false){message=text;error=isError;render()}
function login(){document.getElementById('logout').hidden=true;$('#app').innerHTML=`<div class="panel login"><div class="eyebrow">Қорғалған бөлім</div><h1>Мұғалім кабинеті</h1><p>Зертханаларды басқарып, оқушылардың нәтижелерін көру үшін кіріңіз.</p>${notice()}<form id="login-form"><label class="field">Мұғалім құпиясөзі<input name="password" type="password" required autofocus></label><button class="btn primary">Кіру →</button></form><p class="hint">Бірінші іске қосқанда құпиясөз <code>data/teacher-password.txt</code> файлына жазылады.</p></div>`}
function render(){if(!labs.length){$('#app').innerHTML=notice()+`<div class="panel empty"><strong>Зертханалар жүктелуде…</strong></div>`;return}document.getElementById('logout').hidden=false;const lab=labs.find(l=>l.id===selected)||labs[0];selected=lab.id;const count=results.length;const average=count?(results.reduce((n,r)=>n+r.score/r.maxScore,0)/count*100).toFixed(0)+'%':'—';
$('#app').innerHTML=`<div class="heading"><div><div class="eyebrow">Мұғалім кабинеті</div><h1>Сынып зертханалары</h1><p>Мерзімді өңдеңіз, сілтемені бөлісіңіз және тапсырылған жұмыстарды қараңыз.</p></div><button class="btn primary" data-action="new">+ Жаңа зертхана</button></div>${notice()}<div class="layout"><aside class="panel"><div class="panelhead"><h2>Зертханалар тізімі</h2><span class="status">${labs.length}</span></div><div class="lablist">${labs.map(l=>`<button class="labitem ${l.id===selected?'on':''}" data-action="select" data-id="${esc(l.id)}"><b>${esc(l.title)}</b><small>${esc(l.className)} сынып · ${l.resultCount} есеп</small><span class="tag ${l.accepting?'':'closed'}">${label(l)}</span></button>`).join('')}</div></aside><div class="content"><section class="panel intro"><div class="eyebrow">${lab.kind==='enzyme'?'Ферменттер · жұмыс парағы':'Осмос · виртуалды зертхана'}</div><h2>${esc(lab.title)}</h2><p>${esc(lab.className)} сынып · ${dateText(lab.deadline)} · <span class="tag ${lab.accepting?'':'closed'}">${label(lab)}</span></p></section><div class="statgrid"><div class="stat"><span>Тапсырылған жұмыс</span><b>${count}</b></div><div class="stat"><span>Орташа нәтиже</span><b>${average}</b></div><div class="stat"><span>Ағымдағы күй</span><b style="font-size:22px">${label(lab)}</b></div></div><section class="panel"><div class="panelhead"><h2>Тапсырма параметрлері</h2><span class="hint">Мерзім сервер уақытында тексеріледі</span></div><form id="settings-form"><div class="formgrid"><label class="field wide">Атауы<input name="title" maxlength="120" required value="${esc(lab.title)}"></label><label class="field">Сынып<input name="className" maxlength="30" required value="${esc(lab.className)}"></label><label class="field">Соңғы тапсыру уақыты<input name="deadline" type="datetime-local" value="${localDate(lab.deadline)}"></label></div><div class="settingsfoot"><label class="switchline"><input name="isOpen" type="checkbox" ${lab.isOpen?'checked':''}> Тапсыру ашық</label><button class="btn primary">Өзгерістерді сақтау</button></div></form><div class="sharebar"><div><div class="eyebrow">Оқушыларға сілтеме</div><code>${esc(link(lab))}</code></div><button class="btn" data-action="copy">Сілтемені көшіру ↗</button></div></section><section class="panel"><div class="panelhead"><h2>Оқушылар нәтижелері</h2><div style="display:flex;gap:7px"><button class="btn" data-action="refresh">Жаңарту ↻</button><a class="btn" href="/api/teacher/labs/${encodeURIComponent(lab.id)}/results.csv">CSV жүктеу ↓</a></div></div>${results.length?`<div class="tablewrap"><table><thead><tr><th>Оқушы</th><th>Сынып</th><th>Балл</th><th>Тапсырылған</th><th></th></tr></thead><tbody>${results.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.className)}</td><td><b>${r.score} / ${r.maxScore}</b></td><td>${dateText(r.submittedAt)}</td><td><button class="btn" data-action="result" data-id="${esc(r.id)}">Ашу ↗</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><strong>Әзірге тапсырылған жұмыс жоқ</strong>Оқушылар сілтемені ашып, жұмысты тапсырғанда нәтижелер осында келеді.</div>'}</section></div></div>`}
async function load(){try{const data=await api('/api/teacher/labs');labs=data.labs;if(!selected||!labs.some(l=>l.id===selected))selected=new URLSearchParams(location.search).get('lab')||labs[0]?.id||'';if(!labs.some(l=>l.id===selected))selected=labs[0]?.id||'';if(selected){const report=await api('/api/teacher/labs/'+encodeURIComponent(selected)+'/results');results=report.results}else results=[];render()}catch(e){setMessage(e.message,true)}}
function newLab(){document.getElementById('modal-root').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true"><div class="modalhead"><b>Жаңа зертхана</b><button class="btn" data-action="close">Жабу</button></div><form id="new-form"><div class="formgrid"><label class="field wide">Зертхана түрі<select name="kind"><option value="osmosis">Осмос · виртуалды зертхана</option><option value="enzyme">Ферменттер · жұмыс парағы</option></select></label><label class="field wide">Тапсырма атауы<input name="title" maxlength="120" required placeholder="Зертханалық жұмыс атауы"></label><label class="field">Сынып<input name="className" maxlength="30" required placeholder="9 А"></label><label class="field">Соңғы тапсыру уақыты<input name="deadline" type="datetime-local"></label></div><div class="settingsfoot"><span class="hint">Бос мерзім: шектеусіз</span><button class="btn primary">Құру</button></div></form></section></div>`}
function detail(r){const p=r.payload;let body='';if(p.captures){body=`<h3>Болжам</h3><p>${esc(p.hypothesis)}</p><h3>Бақылаулар</h3>${p.captures.map(c=>`<div class="answer"><b>${esc(c.kind)}</b><p>${esc(c.note)}</p></div>`).join('')}<h3>Теориялық жауаптар</h3><div class="answer">${Object.entries(p.answers).map(([k,v])=>esc(k)+': '+esc(v)).join('<br>')}</div><h3>Қорытынды</h3><p>${esc(p.conclusion)}</p>`}else{const a=p.answers;body=`<h3>Болжам</h3><div class="answer">pH: ${esc(a.predictionPh)} · Температура: ${esc(a.predictionTemp)}</div><h3>Бақылау түстері</h3><div class="answer">${Object.entries(a.colors).map(([k,v])=>esc(k)+': '+esc(v)).join('<br>')}</div><h3>Салыстыру</h3><div class="answer">${Object.values(a.comparison).map(esc).join(' · ')}</div><h3>Қорытынды</h3><div class="answer">${esc(a.conclusion.protein)} · ${esc(a.conclusion.change)} · ${esc(a.conclusion.prediction)}<p>${esc(a.conclusion.reason)}</p></div>`}document.getElementById('modal-root').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true"><div class="modalhead"><b>Оқушы жұмысы</b><button class="btn" data-action="close">Жабу</button></div><div class="modalbody detail"><div class="eyebrow">${dateText(r.submittedAt)}</div><h2>${esc(r.name)}</h2><div class="tag">${r.score} / ${r.maxScore} балл</div><span class="status"> · ${esc(r.className)} сынып</span>${body}<p class="hint">Жазбаша қорытындыны мұғалім жеке бағалайды.</p></div></section></div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='close')document.getElementById('modal-root').innerHTML='';if(a==='new')newLab();if(a==='select'){selected=b.dataset.id;results=[];message='';await load()}if(a==='refresh')await load();if(a==='copy'){const l=labs.find(x=>x.id===selected);try{await navigator.clipboard.writeText(link(l));setMessage('Оқушы сілтемесі көшірілді.')}catch{setMessage('Сілтеме: '+link(l))}}if(a==='result'){try{const data=await api('/api/teacher/submissions/'+encodeURIComponent(b.dataset.id));detail(data.result)}catch(err){setMessage(err.message,true)}}});
document.addEventListener('submit',async e=>{const f=e.target;if(!['login-form','settings-form','new-form'].includes(f.id))return;e.preventDefault();const d=new FormData(f);try{if(f.id==='login-form'){await api('/api/teacher/login','POST',{password:String(d.get('password'))});message='';await load()}if(f.id==='settings-form'){const deadline=d.get('deadline')?new Date(String(d.get('deadline'))).toISOString():null;await api('/api/teacher/labs/'+encodeURIComponent(selected),'PATCH',{title:String(d.get('title')).trim(),className:String(d.get('className')).trim(),deadline,isOpen:d.has('isOpen')});message='Параметрлер сақталды.';error=false;await load()}if(f.id==='new-form'){const deadline=d.get('deadline')?new Date(String(d.get('deadline'))).toISOString():null;const response=await api('/api/teacher/labs','POST',{kind:d.get('kind'),title:String(d.get('title')).trim(),className:String(d.get('className')).trim(),deadline});document.getElementById('modal-root').innerHTML='';selected=response.lab.id;message='Жаңа зертхана құрылды.';error=false;await load()}}catch(err){setMessage(err.message,true)}});
document.getElementById('logout').addEventListener('click',async()=>{await api('/api/teacher/logout','POST',{});labs=[];results=[];message='';login()});
api('/api/teacher/me').then(()=>load()).catch(()=>login());
setInterval(async()=>{if(!labs.length||document.querySelector('#modal-root .modal')||document.activeElement?.closest('form'))return;try{const [listing,report]=await Promise.all([api('/api/teacher/labs'),api('/api/teacher/labs/'+encodeURIComponent(selected)+'/results')]);const changed=JSON.stringify(listing.labs)!==JSON.stringify(labs)||JSON.stringify(report.results.map(r=>r.id))!==JSON.stringify(results.map(r=>r.id));if(changed){labs=listing.labs;results=report.results;render()}}catch{}},15000);
})();
</script></body></html>
